<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Home healthcare illustration showing a home, nurse and patient">
  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FAF8"/><stop offset="1" stop-color="#DCF2EE"/>
    </linearGradient>
    <linearGradient id="hHouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D7A6D"/><stop offset="1" stop-color="#06463F"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#hBg)"/>
  <circle cx="72" cy="300" r="112" fill="#B6E4DD" opacity=".6"/>
  <circle cx="412" cy="64" r="78" fill="#FCEFD8" opacity=".9"/>

  <!-- house -->
  <g transform="translate(228 178)">
    <path d="M-104 6 0-72 104 6v104a12 12 0 0 1-12 12h-184a12 12 0 0 1-12-12Z" fill="url(#hHouse)"/>
    <rect x="-26" y="46" width="52" height="76" rx="8" fill="#DCF2EE"/>
    <circle cx="16" cy="84" r="4" fill="#0A6157"/>
    <rect x="-84" y="30" width="44" height="34" rx="7" fill="#3FAFA2"/>
    <rect x="40" y="30" width="44" height="34" rx="7" fill="#3FAFA2"/>
    <rect x="-84" y="30" width="44" height="14" rx="6" fill="#7FCEC3"/>
    <rect x="40" y="30" width="44" height="14" rx="6" fill="#7FCEC3"/>
    <rect x="-16" y="-122" width="32" height="42" rx="6" fill="#E2951F"/>
    <path d="M-88 122h176" stroke="#0A6157" stroke-width="6" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- heart pulse badge -->
