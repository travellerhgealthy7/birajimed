    <rect x="-18" y="-30" width="36" height="56" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <path d="M-18 4h36v10a10 10 0 0 1-10 10h-16a10 10 0 0 1-10-10Z" fill="#3FAFA2"/>
