    <path d="M-14-56c0-16 8-26 20-24 9 1 14 8 14 15-8 2-16 1-22-2-3 6-8 10-12 11Z" fill="#06463F"/>
    <path d="M-30-16h60l8 74h-76Z" fill="#fff"/>
