<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Prescription and controlled medication illustration showing a prescription pad, vials and a compliance seal">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FAF8"/><stop offset="1" stop-color="#DCF2EE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#pBg)"/>
  <circle cx="400" cy="290" r="112" fill="#B6E4DD" opacity=".6"/>
  <circle cx="70" cy="70" r="76" fill="#FCEFD8" opacity=".9"/>

  <!-- prescription clipboard -->
  <g transform="translate(96 92)">
    <rect x="0" y="0" width="196" height="212" rx="14" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <rect x="62" y="-14" width="72" height="34" rx="10" fill="#06463F"/>
    <rect x="76" y="-6" width="44" height="10" rx="5" fill="#3FAFA2"/>
    <g fill="#E0EDEA">
      <rect x="26" y="48" width="144" height="10" rx="5"/>
      <rect x="26" y="72" width="144" height="10" rx="5"/>
      <rect x="26" y="96" width="112" height="10" rx="5"/>
      <rect x="26" y="120" width="144" height="10" rx="5"/>
      <rect x="26" y="144" width="88" height="10" rx="5"/>
    </g>
    <g transform="translate(150 164)">
      <path d="M0-22 22-13v13c0 14-10 23-22 28C-12 23-22 14-22 0v-13L0-22Z" fill="#0A6157"/>
      <path d="M0-6v12M-6 0h12" stroke="#7FCEC3" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- medicine vials -->
  <g transform="translate(360 150)">
    <rect x="-30" y="-40" width="60" height="118" rx="13" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <rect x="-33" y="-58" width="66" height="24" rx="9" fill="#0A6157"/>
    <rect x="-30" y="18" width="60" height="60" rx="13" fill="#0D7A6D"/>
    <rect x="-16" y="-24" width="32" height="30" rx="7" fill="#F1FAF8" stroke="#C9DED9" stroke-width="2"/>
    <path d="M0-18v18M-9-9h18" stroke="#0A6157" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- blister strips -->
  <g transform="translate(330 292) rotate(6)">
    <rect x="-60" y="-20" width="120" height="40" rx="9" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <g fill="#DCF2EE">
      <circle cx="-36" cy="0" r="10"/><circle cx="-8" cy="0" r="10"/><circle cx="20" cy="0" r="10"/><circle cx="46" cy="0" r="10"/>
    </g>
  </g>

  <!-- lock -->
  <g transform="translate(66 268)">
    <rect x="-22" y="-4" width="44" height="36" rx="9" fill="#E2951F"/>
    <path d="M-13-4v-9a13 13 0 0 1 26 0v9" fill="none" stroke="#C77E17" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="4" fill="#fff"/>
  </g>
</svg>
