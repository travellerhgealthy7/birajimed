<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Diagnostics illustration showing sample tubes and a microscope">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FAF8"/><stop offset="1" stop-color="#DCF2EE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#dBg)"/>
  <circle cx="78" cy="76" r="86" fill="#FCEFD8" opacity=".9"/>
  <circle cx="412" cy="300" r="112" fill="#B6E4DD" opacity=".6"/>

  <!-- microscope -->
  <g transform="translate(322 186)">
    <rect x="-72" y="82" width="144" height="18" rx="9" fill="#06463F"/>
    <path d="M-40 82 0-8l34 14-34 76Z" fill="#0A6157"/>
    <path d="M-2-14 34-30l14 26-30 18Z" fill="#0D7A6D"/>
    <rect x="-20" y="-56" width="40" height="30" rx="8" fill="#3FAFA2"/>
    <rect x="-4" y="-26" width="10" height="34" rx="5" fill="#B4C8C5"/>
    <rect x="-30" y="48" width="52" height="10" rx="5" fill="#0D7A6D"/>
  </g>

  <!-- sample tubes -->
  <g transform="translate(128 150)">
    <g>
      <rect x="-16" y="-58" width="32" height="104" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
      <rect x="-16" y="-16" width="32" height="62" rx="10" fill="#E2951F"/>
      <rect x="-18" y="-70" width="36" height="18" rx="7" fill="#06463F"/>
      <rect x="-9" y="-40" width="18" height="26" rx="4" fill="#FCEFD8" opacity=".9"/>
    </g>
    <g transform="translate(56 0)">
      <rect x="-16" y="-58" width="32" height="104" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
      <rect x="-16" y="-16" width="32" height="62" rx="10" fill="#0D7A6D"/>
      <rect x="-18" y="-70" width="36" height="18" rx="7" fill="#06463F"/>
      <rect x="-9" y="-40" width="18" height="26" rx="4" fill="#DCF2EE" opacity=".9"/>
    </g>
    <g transform="translate(112 0)">
      <rect x="-16" y="-58" width="32" height="104" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
      <rect x="-16" y="-16" width="32" height="62" rx="10" fill="#3FAFA2"/>
      <rect x="-18" y="-70" width="36" height="18" rx="7" fill="#06463F"/>
      <rect x="-9" y="-40" width="18" height="26" rx="4" fill="#DCF2EE" opacity=".9"/>
    </g>
  </g>

  <!-- report card -->
  <g transform="translate(96 282)">
    <rect x="0" y="0" width="196" height="62" rx="12" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <g fill="#DCF2EE">
      <rect x="18" y="16" width="86" height="8" rx="4"/><rect x="18" y="34" width="126" height="8" rx="4"/>
    </g>
    <circle cx="160" cy="31" r="18" fill="#0A6157"/>
    <path d="m152 31 6 6 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
