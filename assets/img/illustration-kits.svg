<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Travel medicine kit illustration showing a first aid kit, medicine bottles and supplies">
  <defs>
    <linearGradient id="kBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FAF8"/><stop offset="1" stop-color="#DCF2EE"/>
    </linearGradient>
    <linearGradient id="kBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D7A6D"/><stop offset="1" stop-color="#06463F"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#kBg)"/>
  <circle cx="84" cy="290" r="104" fill="#B6E4DD" opacity=".6"/>
  <circle cx="416" cy="76" r="82" fill="#FCEFD8" opacity=".9"/>

  <!-- first aid kit -->
  <g transform="translate(150 150)">
    <rect x="-96" y="-46" width="192" height="118" rx="18" fill="url(#kBox)"/>
    <rect x="-96" y="-46" width="192" height="26" rx="13" fill="#0A6157"/>
    <path d="M-34-46v-14a14 14 0 0 1 14-14h40a14 14 0 0 1 14 14v14" fill="none" stroke="#06463F" stroke-width="9" stroke-linecap="round"/>
    <rect x="-34" y="-18" width="68" height="22" rx="7" fill="#E0EDEA"/>
    <path d="M0-22v30M-15-7h30" stroke="#0D7A6D" stroke-width="8" stroke-linecap="round"/>
    <rect x="-70" y="24" width="140" height="10" rx="5" fill="#0A6157" opacity=".65"/>
    <rect x="-70" y="44" width="96" height="10" rx="5" fill="#0A6157" opacity=".45"/>
  </g>

  <!-- medicine bottles -->
  <g transform="translate(78 216)">
    <rect x="-20" y="-8" width="40" height="94" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <rect x="-24" y="-26" width="48" height="22" rx="7" fill="#E2951F"/>
    <rect x="-12" y="26" width="24" height="26" rx="6" fill="#DCF2EE"/>
  </g>
  <g transform="translate(378 196)">
    <rect x="-22" y="-8" width="44" height="100" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <rect x="-26" y="-28" width="52" height="24" rx="8" fill="#06463F"/>
    <rect x="-13" y="28" width="26" height="30" rx="6" fill="#B6E4DD"/>
  </g>

  <!-- blister pack -->
  <g transform="translate(240 268) rotate(-8)">
    <rect x="-72" y="-24" width="144" height="48" rx="10" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <g fill="#DCF2EE">
      <circle cx="-46" cy="0" r="12"/><circle cx="-14" cy="0" r="12"/><circle cx="18" cy="0" r="12"/><circle cx="50" cy="0" r="12"/>
    </g>
    <g fill="#fff" stroke="#B4C8C5" stroke-width="1.5">
      <circle cx="-46" cy="0" r="6"/><circle cx="-14" cy="0" r="6"/><circle cx="18" cy="0" r="6"/><circle cx="50" cy="0" r="6"/>
    </g>
  </g>

  <!-- ORS sachet -->
  <g transform="translate(52 118) rotate(-10)">
    <rect x="-26" y="-34" width="52" height="68" rx="9" fill="#fff" stroke="#C9DED9" stroke-width="2"/>
    <path d="M-26-14h52v-11a9 9 0 0 0-9-9h-34a9 9 0 0 0-9 9Z" fill="#0A6157"/>
    <circle cx="0" cy="14" r="13" fill="#DCF2EE"/>
    <path d="M0 6c4 5 7 8 7 11a7 7 0 0 1-14 0c0-3 3-6 7-11Z" fill="#0D7A6D"/>
  </g>
</svg>
